server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    server_tokens off;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cuentas de clientes: se envían al contenedor "api"
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Pagos y comprobantes: se envían al contenedor "pagos"
    location /api/pagos/ {
        resolver 127.0.0.11 valid=10s;
        set $pagos http://pagos:4000;
        proxy_pass $pagos;
        proxy_set_header Host $host;
    }

    # Las imágenes casi no cambian: que el navegador las guarde una semana
    location /img/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}